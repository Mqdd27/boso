[project]
name = "boso-pipeline"
version = "0.0.1"
description = "Build pipeline for boso course packs"
license = "Unlicense"
requires-python = ">=3.12"
dependencies = [
    "jsonschema>=4.23",
    "kiwipiepy>=0.25.1",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "referencing>=0.35",
]

[project.scripts]
pipeline = "pipeline.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
]

[build-system]
requires = ["uv_build>=0.8,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "pipeline"
module-root = ""

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["SIM905"]  # "a b c".split() tables read better than long list literals

[tool.pytest.ini_options]
testpaths = ["tests"]
